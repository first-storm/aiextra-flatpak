name: Check for upstream updates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit and push manifest updates to main
  actions: write # dispatch build.yml

concurrency:
  group: update-check
  cancel-in-progress: false

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: flatpak-external-data-checker
      GIT_COMMITTER_NAME: flatpak-external-data-checker
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # flatpak-external-data-checker resolves each manifest's x-checker-data
      # and rewrites the extra-data url/sha256/size in place when a newer
      # version is published.
      #
      # Dynamically discovers all application manifests and checks each of them.
      # --commit-to-current-branch commits straight onto the checked out main
      # rather than cutting an update-* branch and opening a PR.
      - name: Run flatpak-external-data-checker on all manifests
        id: checker
        continue-on-error: true
        run: bash tools/check-updates.sh

      # if: always() so an update an earlier checker already committed still
      # ships when a later one fails; the failed step keeps the run red.
      - name: Push updates and rebuild
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]; then
            echo "No updates found."
            exit 0
          fi
          git push origin main
          # Pushes authenticated with GITHUB_TOKEN don't trigger other
          # workflows, so build.yml has to be dispatched explicitly.
          gh workflow run build.yml --ref main

      # Ensure the workflow run is marked red if any application checker failed,
      # after any successful updates have already been pushed.
      - name: Fail workflow if any checker failed
        if: always() && (steps.checker.outputs.failure_count != '0' || steps.checker.outcome == 'failure')
        run: |
          echo "::error::External data checker failed for: ${{ steps.checker.outputs.failed_apps }}"
          exit 1
