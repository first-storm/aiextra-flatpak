name: Check for upstream updates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # commit and push manifest updates to main
  actions: write # dispatch build.yml

concurrency:
  group: update-check
  cancel-in-progress: false

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: flatpak-external-data-checker
      GIT_COMMITTER_NAME: flatpak-external-data-checker
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # flatpak-external-data-checker resolves each manifest's x-checker-data
      # and rewrites the extra-data url/sha256/size in place when a newer
      # version is published: type: debian-repo against OpenAI's / Anthropic's
      # apt repo indexes, and type: json against Z.AI's releases API, which is
      # all they publish (no apt repo). --commit-to-current-branch commits
      # straight onto the checked out main rather than cutting an update-*
      # branch and opening a PR, so every app's update accumulates as ordinary
      # commits that the push below ships together. (A PR round-trip buys
      # nothing here: no review, no CI on PRs, and each later checker would
      # otherwise branch off the previous one's branch and open its PR against
      # the wrong base.)
      - name: Check ChatGPT manifest
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --update --commit-to-current-branch com.openai.ChatGPT/com.openai.ChatGPT.yml

      - name: Check Claude manifest
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --update --commit-to-current-branch com.anthropic.Claude/com.anthropic.Claude.yml

      - name: Check ZCode manifest
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        with:
          args: --update --commit-to-current-branch ai.z.ZCode/ai.z.ZCode.yml

      # if: always() so an update an earlier checker already committed still
      # ships when a later one fails; the failed step keeps the run red.
      - name: Push updates and rebuild
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse @{u})" ]; then
            echo "No updates found."
            exit 0
          fi
          git push origin main
          # Pushes authenticated with GITHUB_TOKEN don't trigger other
          # workflows, so build.yml has to be dispatched explicitly.
          gh workflow run build.yml --ref main
