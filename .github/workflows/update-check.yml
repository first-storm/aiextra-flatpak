name: Check for upstream updates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # flatpak-external-data-checker resolves each manifest's
      # x-checker-data (type: debian-repo) against OpenAI's / Anthropic's
      # apt repo indexes, and rewrites the extra-data url/sha256/size in
      # place when a newer version is published. --never-fork commits
      # straight to main instead of opening a PR, which in turn triggers
      # build.yml to rebuild and republish to GitHub Pages.
      - name: Check ChatGPT manifest
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: flatpak-external-data-checker
          GIT_COMMITTER_NAME: flatpak-external-data-checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork com.openai.ChatGPT/com.openai.ChatGPT.yml

      - name: Check Claude manifest
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: flatpak-external-data-checker
          GIT_COMMITTER_NAME: flatpak-external-data-checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork com.anthropic.Claude/com.anthropic.Claude.yml
