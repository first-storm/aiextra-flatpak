name: Check for upstream updates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # flatpak-external-data-checker resolves each manifest's
      # x-checker-data (type: debian-repo) against OpenAI's / Anthropic's
      # apt repo indexes, and rewrites the extra-data url/sha256/size in
      # place when a newer version is published. --never-fork pushes the
      # update branch to this repo instead of forking, but it still opens
      # a PR against main via the GitHub API, so pull-requests: write is
      # required. Merging that PR triggers build.yml to rebuild and
      # republish to GitHub Pages.
      - name: Check ChatGPT manifest
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: flatpak-external-data-checker
          GIT_COMMITTER_NAME: flatpak-external-data-checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork com.openai.ChatGPT/com.openai.ChatGPT.yml

      - name: Check Claude manifest
        uses: docker://ghcr.io/flathub/flatpak-external-data-checker:latest
        env:
          GIT_AUTHOR_NAME: flatpak-external-data-checker
          GIT_COMMITTER_NAME: flatpak-external-data-checker
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --update --never-fork com.anthropic.Claude/com.anthropic.Claude.yml

      # The checker doesn't merge PRs on its own here: it only auto-merges
      # when the repo has a flathub.json with automerge-flathubbot-prs, or
      # for BROKEN-source fixes, and it gates that on CI status which this
      # repo never posts. Merge every update-* PR directly so build.yml
      # (push-to-main triggered) actually republishes the update. if:
      # always() so a failure in one Check step doesn't skip merging a PR
      # the other step already opened.
      - name: Merge update PRs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("update-")) | .number' |
          while read -r pr; do
            gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --rebase --delete-branch
          done
