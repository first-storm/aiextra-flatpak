name: Build and publish Flatpak repo

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/update-check.yml"
  workflow_dispatch:
    inputs:
      apps:
        description: "Space- or comma-separated app IDs to build (leave empty for all)"
        required: false
        type: string
        default: ""

concurrency:
  group: build-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.build_plan.outputs.apps }}
      matrix: ${{ steps.build_plan.outputs.matrix }}
      runtimes: ${{ steps.build_plan.outputs.runtimes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install manifest parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      # `aiextra plan` resolves the target applications, then derives the
      # architecture matrix and the runtime list from those applications'
      # own configuration. Target selection is always one explicit mode, so
      # "nothing changed" can never be mistaken for "rebuild everything".
      - name: Determine applications, architectures and runtimes to build
        id: build_plan
        env:
          # Via env, never interpolated into the script: `apps` is
          # caller-supplied input.
          INPUT_APPS: ${{ inputs.apps }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_APPS" ]; then
            set -- "$INPUT_APPS"
          elif [ "$EVENT_NAME" = "push" ]; then
            set -- --since "$BEFORE_SHA"
          else
            set -- --all
          fi
          tools/aiextra.py plan "$@"

  build:
    needs: plan
    if: needs.plan.outputs.apps != ''
    strategy:
      fail-fast: false
      # One arch at a time: each leg checks out the current gh-pages state,
      # adds its ref to the shared OSTree repo, and publishes before the next
      # leg starts. Running both legs in parallel would race two publishes
      # against the same branch, and the second to land would overwrite the
      # first's freshly-added ref with a stale gh-pages checkout.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Seed `repo/` with whatever is already published. flatpak-builder
      # then updates it incrementally (it's a normal OSTree repo, refs are
      # independent), so if e.g. one manifest failed to build, the
      # other apps' new refs still get published and the failed app's
      # ref/objects from the last successful build are carried over untouched
      # instead of being wiped out by the publish step.
      - name: Check out existing gh-pages as a starting point
        uses: actions/checkout@v4
        continue-on-error: true # first-ever run: gh-pages doesn't exist yet
        with:
          ref: gh-pages
          path: repo

      - name: Ensure repo/ exists and has no leftover git metadata
        run: |
          mkdir -p repo
          rm -rf repo/.git

      - name: Install flatpak, flatpak-builder and the manifest parser
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg python3-yaml

      # Signs new OSTree commits/summary so `flatpak remote-add` with the
      # published GPGKey (see aiextra.flatpakrepo) can verify them. The
      # private key lives only as the GPG_PRIVATE_KEY repo secret.
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --homedir "$GNUPGHOME" --import
          KEY_ID=$(gpg --batch --homedir "$GNUPGHOME" --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      # Ubuntu 24.04 runners restrict unprivileged user namespaces by
      # default (AppArmor), which breaks bwrap (and therefore
      # flatpak-builder's sandboxed build-commands) with errors like
      # "Creating new namespace failed: Operation not permitted". This is
      # the standard workaround used by flatpak's own CI.
      - name: Allow unprivileged user namespaces (bwrap needs this)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # The exact refs come from the manifests themselves via `aiextra plan`,
      # so bumping a manifest's runtime-version needs no workflow edit.
      # Each matrix leg runs on a runner whose CPU already matches
      # matrix.arch, so this installs (and flatpak-builder later builds)
      # natively, with no --arch flag or cross/QEMU setup needed.
      - name: Install runtime, SDK and Electron base app
        run: sudo flatpak install -y flathub ${{ needs.plan.outputs.runtimes }}

      # extra-data sources are not fetched by flatpak-builder (only recorded
      # as {url, sha256, size} metadata for the end user's `flatpak install`
      # to resolve later), so these builds never download the actual
      # multi-hundred-MB vendor binaries.
      #
      # Each build is independent: one app failing to build must not block
      # other apps' updates from being published.
      - name: Build Flatpak applications
        id: build_apps
        continue-on-error: true
        run: tools/aiextra.py build --arch ${{ matrix.arch }} ${{ needs.plan.outputs.apps }}

      # Repository maintenance, not part of any one app's build: drop refs
      # for architectures an application no longer configures. Runs over
      # every application so an app that dropped an arch is cleaned up even
      # when it is not in this run's build set.
      - name: Drop refs for unconfigured architectures
        continue-on-error: true
        run: tools/aiextra.py prune --all

      # One place decides whether this leg produced anything worth shipping.
      # An empty succeeded_count means the build step died before reporting.
      - name: Decide whether there is anything to publish
        id: publishable
        run: |
          echo "yes=${{ steps.build_apps.outputs.succeeded_count != '' && steps.build_apps.outputs.succeeded_count != '0' }}" >> "$GITHUB_OUTPUT"

      - name: Sign repo metadata and assemble Pages site
        if: steps.publishable.outputs.yes == 'true'
        run: |
          flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" repo
          cp aiextra.flatpakrepo README.md .nojekyll repo/

      - name: Publish to GitHub Pages
        if: steps.publishable.outputs.yes == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages

      # continue-on-error hides individual build failures from the step
      # result, so surface it explicitly here: the workflow run should
      # still show red (and notify) if any app failed, even though the
      # other apps' updates were published successfully. An empty
      # failed_count (the tool died early) also trips this.
      - name: Fail the workflow if any app failed to build
        if: steps.build_apps.outputs.failed_count != '0'
        run: |
          echo "::error::[${{ matrix.arch }}] Flatpak builds failed for: ${{ steps.build_apps.outputs.failed }}"
          exit 1
