name: Build and publish Flatpak repo

on:
  push:
    branches: [main]
    paths:
      - 'com.openai.ChatGPT/**'
      - 'com.anthropic.Claude/**'
      - 'ai.z.ZCode/**'
      - 'aiextra.flatpakrepo'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # One arch at a time: each leg checks out the current gh-pages state,
      # adds its ref to the shared OSTree repo, and publishes before the next
      # leg starts. Running both legs in parallel would race two publishes
      # against the same branch, and the second to land would overwrite the
      # first's freshly-added ref with a stale gh-pages checkout.
      max-parallel: 1
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Seed `repo/` with whatever is already published. flatpak-builder
      # then updates it incrementally (it's a normal OSTree repo, refs are
      # independent), so if e.g. only Claude's manifest failed to build, the
      # other apps' new refs still get published and Claude's ref/objects
      # from the last successful build are carried over untouched instead of
      # being wiped out by the publish step.
      - name: Check out existing gh-pages as a starting point
        uses: actions/checkout@v4
        continue-on-error: true # first-ever run: gh-pages doesn't exist yet
        with:
          ref: gh-pages
          path: repo

      - name: Ensure repo/ exists and has no leftover git metadata
        run: |
          mkdir -p repo
          rm -rf repo/.git

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg

      # Signs new OSTree commits/summary so `flatpak remote-add` with the
      # published GPGKey (see aiextra.flatpakrepo) can verify them. The
      # private key lives only as the GPG_PRIVATE_KEY repo secret.
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | base64 -d | gpg --batch --homedir "$GNUPGHOME" --import
          KEY_ID=$(gpg --batch --homedir "$GNUPGHOME" --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

      # Ubuntu 24.04 runners restrict unprivileged user namespaces by
      # default (AppArmor), which breaks bwrap (and therefore
      # flatpak-builder's sandboxed build-commands) with errors like
      # "Creating new namespace failed: Operation not permitted". This is
      # the standard workaround used by flatpak's own CI.
      - name: Allow unprivileged user namespaces (bwrap needs this)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Add Flathub remote
        run: sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      # Each matrix leg runs on a runner whose CPU already matches
      # matrix.arch, so this installs (and flatpak-builder later builds) the
      # runtime/SDK/BaseApp for that arch natively, with no --arch flag or
      # cross/QEMU setup needed.
      - name: Install runtime, SDK and Electron base app
        run: |
          sudo flatpak install -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      # extra-data sources are not fetched by flatpak-builder (only recorded
      # as {url, sha256, size} metadata for the end user's `flatpak install`
      # to resolve later), so these builds never download the actual
      # multi-hundred-MB vendor binaries.
      #
      # Each build is independent (continue-on-error): one app failing to
      # build must not block the other apps' updates from being published.
      - name: Build ChatGPT
        id: build-chatgpt
        continue-on-error: true
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo \
            --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
            build-chatgpt com.openai.ChatGPT/com.openai.ChatGPT.yml

      - name: Build Claude
        id: build-claude
        continue-on-error: true
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo \
            --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
            build-claude com.anthropic.Claude/com.anthropic.Claude.yml

      - name: Build ZCode
        id: build-zcode
        continue-on-error: true
        run: |
          flatpak-builder --force-clean --disable-rofiles-fuse --repo=repo \
            --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" \
            build-zcode ai.z.ZCode/ai.z.ZCode.yml

      - name: Update repo metadata
        if: steps.build-chatgpt.outcome == 'success' || steps.build-claude.outcome == 'success' || steps.build-zcode.outcome == 'success'
        run: flatpak build-update-repo --gpg-sign="$GPG_KEY_ID" --gpg-homedir="$GNUPGHOME" repo

      - name: Assemble Pages site
        if: steps.build-chatgpt.outcome == 'success' || steps.build-claude.outcome == 'success' || steps.build-zcode.outcome == 'success'
        run: |
          cp aiextra.flatpakrepo README.md .nojekyll repo/

      - name: Publish to GitHub Pages
        if: steps.build-chatgpt.outcome == 'success' || steps.build-claude.outcome == 'success' || steps.build-zcode.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: gh-pages

      # continue-on-error hides individual step failures from the job
      # result, so surface it explicitly here: the workflow run should
      # still show red (and notify) if any app failed, even though the
      # other apps' updates were published successfully.
      - name: Fail the workflow if any app failed to build
        if: steps.build-chatgpt.outcome == 'failure' || steps.build-claude.outcome == 'failure' || steps.build-zcode.outcome == 'failure'
        run: |
          echo "::error::[${{ matrix.arch }}] ChatGPT build: ${{ steps.build-chatgpt.outcome }}, Claude build: ${{ steps.build-claude.outcome }}, ZCode build: ${{ steps.build-zcode.outcome }}"
          exit 1
