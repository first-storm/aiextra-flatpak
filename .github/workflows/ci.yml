name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install manifest parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      - name: Run the build system's test suite
        run: python3 -m unittest discover -s tests -t tests -v

      # Discovery and validation over the real repository: catches an app
      # whose manifest, directory name or architectures file disagree.
      - name: Validate every packaged application
        run: tools/aiextra.py plan --all
