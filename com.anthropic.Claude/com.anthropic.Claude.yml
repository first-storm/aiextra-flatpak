app-id: com.anthropic.Claude
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: com.anthropic.Claude
separate-locales: false
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: claude-desktop
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm755 claude.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -Dm644 com.anthropic.Claude.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 com.anthropic.Claude.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - |
        set -e
        for size in 16 32 48 128 256; do
          install -Dm644 icon-${size}.png \
            ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png
        done
    sources:
      # amd64 build of Claude Desktop, fetched by the end user's
      # `flatpak install` (not by flatpak-builder) straight from Anthropic's
      # own apt repo and verified against the sha256 below. See
      # https://code.claude.com/docs/en/desktop-linux — the same repo
      # `/etc/apt/sources.list.d/claude-desktop.list` points at.
      - type: extra-data
        filename: claude-desktop.deb
        only-arches: [x86_64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.28929.0_amd64.deb
        sha256: 3ceb391268bde9a7fec32520d349b704043166204cdd571c62d1e950701f48fc
        size: 172264532
        x-checker-data:
          type: debian-repo
          package-name: claude-desktop
          root: https://downloads.claude.ai/claude-desktop/apt/stable
          dist: stable
          component: main
          is-main-source: true
      - type: extra-data
        filename: claude-desktop.deb
        only-arches: [aarch64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.28929.0_arm64.deb
        sha256: 7a5b8bd5fcda0a6b1a6b3711e0142704662e44938a94683068fd90c398c7394d
        size: 164372324
        x-checker-data:
          type: debian-repo
          package-name: claude-desktop
          root: https://downloads.claude.ai/claude-desktop/apt/stable
          dist: stable
          component: main
      - type: file
        path: claude.sh
      - type: file
        path: com.anthropic.Claude.desktop
      - type: file
        path: com.anthropic.Claude.metainfo.xml
      - type: file
        path: ../icons/claude/com.anthropic.Claude-16.png
        dest-filename: icon-16.png
      - type: file
        path: ../icons/claude/com.anthropic.Claude-32.png
        dest-filename: icon-32.png
      - type: file
        path: ../icons/claude/com.anthropic.Claude-48.png
        dest-filename: icon-48.png
      - type: file
        path: ../icons/claude/com.anthropic.Claude-128.png
        dest-filename: icon-128.png
      - type: file
        path: ../icons/claude/com.anthropic.Claude-256.png
        dest-filename: icon-256.png
      - type: script
        dest-filename: apply_extra
        commands:
          # The .deb is an ar archive containing a data.tar.{xz,zst,...}; the
          # actual app lives at usr/lib/claude-desktop/ inside it. bsdtar can
          # read the ar container directly, so pipe its data member straight
          # into a second bsdtar that unpacks just that subtree, flattened
          # into the current directory (/app/extra).
          - bsdtar -Oxf claude-desktop.deb 'data.tar*' | bsdtar -xf - --strip-components=4 ./usr/lib/claude-desktop
          - rm claude-desktop.deb
          # Make Electron report our Flatpak app ID as its Wayland app_id /
          # X11 WM_CLASS so window/taskbar/icon association works. Anthropic
          # already ships an upstream .desktop with
          # StartupWMClass=com.anthropic.Claude, so this keeps that intact.
          - patch-electron-desktop-filename --desktop-filename com.anthropic.Claude --skip-integrity-check resources/app.asar
