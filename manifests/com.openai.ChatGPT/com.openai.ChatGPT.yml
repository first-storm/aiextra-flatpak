app-id: com.openai.ChatGPT
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: com.openai.ChatGPT
separate-locales: false
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --persist=.codex
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: chatgpt
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm755 chatgpt.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -Dm644 com.openai.ChatGPT.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 com.openai.ChatGPT.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - |
        set -e
        for f in icons/*.png; do
          size=${f##*-}
          size=${size%.png}
          install -Dm644 "$f" \
            ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png
        done
    sources:
      # amd64 build of the ChatGPT desktop app, fetched by the end user's
      # `flatpak install` (not by flatpak-builder) straight from OpenAI's own
      # apt repo and verified against the sha256 below. See
      # https://persistent.oaistatic.com/codex-app-prod/linux/deb (Suites:
      # stable, Components: main) — the same repo `chatgpt.sources` points at.
      - type: extra-data
        filename: chatgpt.deb
        only-arches: [x86_64]
        url: https://persistent.oaistatic.com/codex-app-prod/linux/deb/pool/main/c/chatgpt/chatgpt_26.831.21537_amd64.deb
        sha256: 5c156ef2a2e0291596d07bae8660ef4f0b748df3baf91bfc928f7b5e3c610b11
        size: 410146862
        x-checker-data:
          type: debian-repo
          package-name: chatgpt
          root: https://persistent.oaistatic.com/codex-app-prod/linux/deb
          dist: stable
          component: main
          is-main-source: true
      - type: extra-data
        filename: chatgpt.deb
        only-arches: [aarch64]
        url: https://persistent.oaistatic.com/codex-app-prod/linux/deb/pool/main/c/chatgpt/chatgpt_26.831.21537_arm64.deb
        sha256: 2d3d6840c11bf4000d6ff7bdbb0aa0db92df4ce06220812ed54f34a6773504f7
        size: 387061650
        x-checker-data:
          type: debian-repo
          package-name: chatgpt
          root: https://persistent.oaistatic.com/codex-app-prod/linux/deb
          dist: stable
          component: main
      - type: file
        path: chatgpt.sh
      - type: file
        path: com.openai.ChatGPT.desktop
      - type: file
        path: com.openai.ChatGPT.metainfo.xml
      - type: dir
        path: icons
        dest: icons
      - type: script
        dest-filename: apply_extra
        commands:
          # The .deb is an ar archive containing a data.tar.{xz,zst,...}; the
          # actual app lives at usr/lib/chatgpt/ inside it. bsdtar can read
          # the ar container directly, so pipe its data member straight into
          # a second bsdtar that unpacks just that subtree, flattened into
          # the current directory (/app/extra).
          - bsdtar -Oxf chatgpt.deb 'data.tar*' | bsdtar -xf - --strip-components=4
            ./usr/lib/chatgpt
          - rm chatgpt.deb
          # Make Electron report our Flatpak app ID as its Wayland app_id /
          # X11 WM_CLASS so window/taskbar/icon association works.
          - patch-electron-desktop-filename --desktop-filename com.openai.ChatGPT
            --skip-integrity-check resources/app.asar
