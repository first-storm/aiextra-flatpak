app-id: com.anthropic.Claude
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: com.anthropic.Claude
separate-locales: false
tags:
  - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: claude-desktop
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - install -Dm755 apply_extra ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm755 claude.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -Dm644 com.anthropic.Claude.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 com.anthropic.Claude.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - |
        set -e
        for f in icons/*.png; do
          size=${f##*-}
          size=${size%.png}
          install -Dm644 "$f" \
            ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png
        done
    sources:
      # amd64 build of Claude Desktop, fetched by the end user's
      # `flatpak install` (not by flatpak-builder) straight from Anthropic's
      # own apt repo and verified against the sha256 below. See
      # https://code.claude.com/docs/en/desktop-linux — the same repo
      # `/etc/apt/sources.list.d/claude-desktop.list` points at.
      - type: extra-data
        filename: claude-desktop.deb
        only-arches: [x86_64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.32352.1_amd64.deb
        sha256: 9d00c4ea86d037061e1ca1f1709f930ec4a4d7737d87b2f68b87bc3e87e38186
        size: 171870372
        x-checker-data:
          type: debian-repo
          package-name: claude-desktop
          root: https://downloads.claude.ai/claude-desktop/apt/stable
          dist: stable
          component: main
          is-main-source: true
      - type: extra-data
        filename: claude-desktop.deb
        only-arches: [aarch64]
        url: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_1.32352.1_arm64.deb
        sha256: aa45e5f784000bc2995c6ae511a89ad3b7d9e0d63baeda2563faecd5a8850906
        size: 164271352
        x-checker-data:
          type: debian-repo
          package-name: claude-desktop
          root: https://downloads.claude.ai/claude-desktop/apt/stable
          dist: stable
          component: main
      - type: file
        path: claude.sh
      - type: file
        path: com.anthropic.Claude.desktop
      - type: file
        path: com.anthropic.Claude.metainfo.xml
      - type: dir
        path: icons
        dest: icons
      - type: script
        dest-filename: apply_extra
        commands:
          # The .deb is an ar archive containing a data.tar.{xz,zst,...}; the
          # actual app lives at usr/lib/claude-desktop/ inside it. bsdtar can
          # read the ar container directly, so pipe its data member straight
          # into a second bsdtar that unpacks just that subtree, flattened
          # into the current directory (/app/extra).
          - bsdtar -Oxf claude-desktop.deb 'data.tar*' | bsdtar -xf - --strip-components=4
            ./usr/lib/claude-desktop
          - rm claude-desktop.deb
          # Make Electron report our Flatpak app ID as its Wayland app_id /
          # X11 WM_CLASS so window/taskbar/icon association works. Anthropic
          # already ships an upstream .desktop with
          # StartupWMClass=com.anthropic.Claude, so this keeps that intact.
          - patch-electron-desktop-filename --desktop-filename com.anthropic.Claude
            --skip-integrity-check resources/app.asar
